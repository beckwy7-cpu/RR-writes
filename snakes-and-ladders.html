<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snakes & Ladders</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    font-family: 'Georgia', serif;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 12px 20px;
    overflow: visible;
  }

  header {
    text-align: center;
    margin-bottom: 14px;
  }

  header h1 {
    font-size: 2.2rem;
    color: #1e1108;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }

  header p {
    font-style: italic;
    color: #7a6a52;
    font-size: 0.95rem;
  }

  /* ── Board ── */
  .board-frame {
    border: 4px solid #111111;
    box-shadow: none;
    background: #fff;
    position: relative;
    width: min(540px, calc(100vw - 40px));
    aspect-ratio: 6/5;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(5, 1fr);
    width: 100%;
    height: 100%;
    position: relative;
  }

  .square {
    border-right: 1px solid rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    padding: 7px 9px 7px 9px;
    position: relative;
    cursor: default;
    transition: filter 0.15s;
  }

  .square:nth-child(6n) { border-right: none; }
  .square:nth-last-child(-n+6) { border-bottom: none; }

  .square.clickable {
    cursor: pointer;
  }

  .square.clickable:hover {
    filter: brightness(0.93);
    z-index: 5;
  }

  .sq-num {
    font-size: 0.65rem;
    font-weight: bold;
    color: #ff00cc;
    line-height: 1;
    flex-shrink: 0;
  }

  .sq-label {
    font-size: 0.58rem;
    color: #ff00cc;
    margin-top: 5px;
    line-height: 1.35;
    font-style: italic;
  }

  .sq-dot {
    position: absolute;
    bottom: 7px;
    right: 7px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff00cc;
  }

  .sq-fire {
    position: absolute;
    bottom: 4px;
    right: 5px;
    font-size: 0.7rem;
    line-height: 1;
  }

  /* Checkerboard — black and white */
  .c0 { background: #ffffff; }
  .c1 { background: #111111; }
  .c2 { background: #ffffff; }
  .c3 { background: #111111; }

  /* SVG overlay */
  .board-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* Legend */
  .legend {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 0.78rem;
    color: #7a6a52;
    font-style: italic;
    flex-wrap: wrap;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #b84a1a;
    flex-shrink: 0;
  }

  /* ── Slide-in panel ── */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(30,17,8,0.35);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .backdrop.open { opacity: 1; pointer-events: all; }

  .panel {
    position: fixed;
    top: 0; right: -110%;
    width: min(680px, 100%);
    height: 100vh;
    background: #faf7f2;
    z-index: 101;
    display: flex;
    flex-direction: column;
    box-shadow: -6px 0 40px rgba(30,17,8,0.18);
    transition: right 0.38s cubic-bezier(0.32, 0, 0.24, 1);
  }
  .panel.open { right: 0; }

  .panel-top {
    padding: 22px 32px 18px;
    border-bottom: 1px solid #ddd5c4;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    background: #faf7f2;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1.5px solid #1e1108;
    color: #1e1108;
    font-family: 'Georgia', serif;
    font-size: 0.82rem;
    padding: 7px 14px;
    cursor: pointer;
    border-radius: 2px;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.18s, color 0.18s;
  }
  .back-btn:hover { background: #1e1108; color: #faf7f2; }

  .panel-meta {
    flex: 1;
    min-width: 0;
  }
  .panel-sq {
    font-size: 0.7rem;
    color: #9a8870;
    margin-bottom: 2px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .panel-title {
    font-size: 1.2rem;
    color: #1e1108;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .panel-nav {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .nav-btn {
    width: 34px; height: 34px;
    border: 1.5px solid #c4b49e;
    background: none;
    color: #7a6a52;
    border-radius: 2px;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s;
  }
  .nav-btn:hover:not(:disabled) { border-color: #1e1108; color: #1e1108; }
  .nav-btn:disabled { opacity: 0.28; cursor: default; }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 44px 52px 60px;
    color: #1e1108;
    font-size: 1.05rem;
    line-height: 1.85;
  }
  .panel-body p { margin-bottom: 1.3em; }
  .panel-body h2 { font-size: 1.1rem; margin: 1.8em 0 0.7em; }
</style>
</head>
<body>

<header>
  <h1>Snakes &amp; Ladders</h1>
  <p>A collection of essays — click a square to read</p>
</header>

<div class="board-frame">
  <div class="board" id="board"></div>
  <svg class="board-svg" id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="legend">
  <span class="legend-item"><span class="legend-dot"></span> Guidance &amp; instructions</span>
  <span class="legend-item"><span>🔥</span> Hot take</span>
  <span>· Use ← → keys to navigate</span>
</div>

<div class="backdrop" id="backdrop" onclick="closePanel()"></div>

<div class="panel" id="panel">
  <div class="panel-top">
    <button class="back-btn" onclick="closePanel()">&#8592; Board</button>
    <div class="panel-meta">
      <div class="panel-sq" id="pNum"></div>
      <div class="panel-title" id="pTitle"></div>
    </div>
    <div class="panel-nav">
      <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" title="Previous essay">&#8592;</button>
      <button class="nav-btn" id="nextBtn" onclick="navigate(1)" title="Next essay">&#8594;</button>
    </div>
  </div>
  <div class="panel-body" id="pBody"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────
//  YOUR CONTENT — add or edit entries here.
//  Key = square number (1–30), value = { title, body (HTML) }
// ─────────────────────────────────────────────────────────────────────
const CONTENT = {
  1: {
    title: "Start here!",
    type: "instructions",
    body: `<h2>So You've Been Made Redundant: How to Think About Your Next Move</h2>
           <p>The call comes, or the meeting appears without context in your calendar, and then it's done. You have a settlement figure, a leaving date, and a strange afternoon ahead of you with nothing in it.</p>
           <p>The first instinct — and almost everyone has it — is to act. Update the CV. Post something on LinkedIn. Start scrolling job boards. Do something, because doing something feels like control, and control (or the illusion of control) is the thing you've just lost.</p>
           <p>I know this because I did all of it. And I wish someone had sat me down first and said: before you move, find out where you actually are.</p>
           <p>This is that conversation.</p>
           <h2>The Game You're Now Playing</h2>
           <p>Think of what comes next as a game of snakes and ladders. Some moves feel productive and set you back weeks. Others feel slow, almost passive, and turn out to be the things that actually accelerate everything.</p>
           <p>The snakes are usually the urgent-feeling moves: applying for roles before you've got clarity on what you're offering, blasting your network with a "just to let you know" message before you know what you're asking for, letting financial anxiety drive decisions that should be driven by strategy.</p>
           <p>The ladders are less obvious. Restoring your baseline before you start. Knowing the difference between being networked and being connected. Briefing the people who will speak for you before they speak for you.</p>
           <p>None of this is complicated. But almost nobody does it, because the pressure to be seen to be doing something is enormous — and it arrives on day one.</p>
           <p>This article is the starting point of a series. Each piece will go deeper on one of the threads that runs through here. But this one is the spine: a way to take stock of where you actually are, before you make your first move.</p>`
  },
  2: {
    title: "First Steps",
    body: `<p>Replace this with your essay for square 2. You can use as many paragraphs as you like — the panel scrolls.</p>
           <p>You can also use <strong>bold</strong>, <em>italic</em>, or any other HTML formatting you'd like inside the body.</p>`
  },
  5: {
    title: "The Rules We Inherit",
    body: `<p>Your essay for square 5 goes here.</p>`
  },
  9: {
    title: "A Fortunate Slip",
    body: `<p>Your essay for square 9 goes here.</p>`
  },
  14: {
    title: "Halfway",
    body: `<p>Your essay for square 14 goes here.</p>`
  },
  18: {
    title: "The Long Climb",
    body: `<p>Your essay for square 18 goes here.</p>`
  },
  21: {
    title: "What the Snake Taught Me",
    body: `<p>Your essay for square 21 goes here.</p>`
  },
  26: {
    title: "Almost There",
    body: `<p>Your essay for square 26 goes here.</p>`
  },
  30: {
    title: "Arrival",
    body: `<p>Your essay for square 30 goes here.</p>`
  }
};

// ─────────────────────────────────────────────────────────────────────
//  Board layout — 6 cols × 5 rows, classic S&L numbering
//  Visual rows top→bottom:
//  [25,26,27,28,29,30]
//  [24,23,22,21,20,19]
//  [13,14,15,16,17,18]
//  [12,11,10, 9, 8, 7]
//  [ 1, 2, 3, 4, 5, 6]
// ─────────────────────────────────────────────────────────────────────
const GRID = [
  [25,26,27,28,29,30],
  [24,23,22,21,20,19],
  [13,14,15,16,17,18],
  [12,11,10, 9, 8, 7],
  [ 1, 2, 3, 4, 5, 6]
];

const COLS = ['c0','c1','c2','c3'];
const boardEl = document.getElementById('board');

GRID.forEach((row, ri) => {
  row.forEach((num, ci) => {
    const sq = document.createElement('div');
    sq.className = `square ${COLS[(ri + ci) % 4]}`;
    sq.dataset.n = num;

    const numEl = document.createElement('div');
    numEl.className = 'sq-num';
    numEl.textContent = num;
    sq.appendChild(numEl);

    if (CONTENT[num]) {
      sq.classList.add('clickable');
      const lbl = document.createElement('div');
      lbl.className = 'sq-label';
      lbl.textContent = CONTENT[num].title;
      sq.appendChild(lbl);

      if (CONTENT[num].type === 'hot-take') {
        const fire = document.createElement('div');
        fire.className = 'sq-fire';
        fire.textContent = '🔥';
        sq.appendChild(fire);
      } else {
        const dot = document.createElement('div');
        dot.className = 'sq-dot';
        sq.appendChild(dot);
      }

      sq.addEventListener('click', () => openPanel(num));
    }

    boardEl.appendChild(sq);
  });
});

// ── Square centre coords (relative to 540×450 viewBox, scales automatically) ──
const SQ = 90;
function centre(num) {
  for (let r = 0; r < 5; r++)
    for (let c = 0; c < 6; c++)
      if (GRID[r][c] === num)
        return { x: c * SQ + SQ/2, y: r * SQ + SQ/2 };
}

// Set SVG viewBox so coordinates always match the grid regardless of screen size
document.getElementById('svg').setAttribute('viewBox', '0 0 540 450');

// ── Draw snakes & ladders ─────────────────────────────────────────────
//  Ladders go FROM lower number TO higher number (upward)
//  Snakes go FROM higher number TO lower number (downward)
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k,v));
  return e;
}

// ── Ladders — woody, characterful ────────────────────────────────────
function drawLadder(from, to) {
  const a = centre(from), b = centre(to);
  const dx = b.x-a.x, dy = b.y-a.y;
  const len = Math.hypot(dx,dy);
  const nx = -dy/len, ny = dx/len;
  const W = 10;

  // Drop shadow
  svg.appendChild(el('line', {
    x1: a.x+3, y1: a.y+3, x2: b.x+3, y2: b.y+3,
    stroke: 'rgba(0,0,0,0.12)', 'stroke-width': W*2+6, 'stroke-linecap': 'round'
  }));

  // Rails — dark wood outline then lighter fill
  [1,-1].forEach(s => {
    svg.appendChild(el('line', {
      x1: a.x+nx*W*s, y1: a.y+ny*W*s,
      x2: b.x+nx*W*s, y2: b.y+ny*W*s,
      stroke: '#5c3310', 'stroke-width': 7, 'stroke-linecap': 'round'
    }));
    svg.appendChild(el('line', {
      x1: a.x+nx*W*s, y1: a.y+ny*W*s,
      x2: b.x+nx*W*s, y2: b.y+ny*W*s,
      stroke: '#a0632a', 'stroke-width': 5, 'stroke-linecap': 'round'
    }));
    // Highlight sheen on one edge
    if (s === 1) svg.appendChild(el('line', {
      x1: a.x+nx*(W-1)*s, y1: a.y+ny*(W-1)*s,
      x2: b.x+nx*(W-1)*s, y2: b.y+ny*(W-1)*s,
      stroke: 'rgba(255,210,140,0.45)', 'stroke-width': 2, 'stroke-linecap': 'round'
    }));
  });

  // Rungs
  const steps = Math.max(2, Math.ceil(len / 22));
  for (let i = 1; i < steps; i++) {
    const t = i/steps;
    const rx = a.x+dx*t, ry = a.y+dy*t;
    svg.appendChild(el('line', {
      x1: rx+nx*W*1.15+1, y1: ry+ny*W*1.15+1,
      x2: rx-nx*W*1.15+1, y2: ry-ny*W*1.15+1,
      stroke: 'rgba(0,0,0,0.15)', 'stroke-width': 5, 'stroke-linecap': 'round'
    }));
    svg.appendChild(el('line', {
      x1: rx+nx*W*1.15, y1: ry+ny*W*1.15,
      x2: rx-nx*W*1.15, y2: ry-ny*W*1.15,
      stroke: '#7a4820', 'stroke-width': 5, 'stroke-linecap': 'round'
    }));
    svg.appendChild(el('line', {
      x1: rx+nx*W*1.15, y1: ry+ny*W*1.15,
      x2: rx-nx*W*1.15, y2: ry-ny*W*1.15,
      stroke: 'rgba(255,200,120,0.3)', 'stroke-width': 2, 'stroke-linecap': 'round'
    }));
  }

  // End bolts
  [a,b].forEach(pt => {
    svg.appendChild(el('circle', { cx: pt.x+1, cy: pt.y+1, r: 7, fill: 'rgba(0,0,0,0.15)' }));
    svg.appendChild(el('circle', { cx: pt.x, cy: pt.y, r: 7, fill: '#5c3310' }));
    svg.appendChild(el('circle', { cx: pt.x, cy: pt.y, r: 4, fill: '#c89050' }));
    svg.appendChild(el('circle', { cx: pt.x-1, cy: pt.y-1, r: 1.5, fill: 'rgba(255,240,180,0.8)' }));
  });
}

// ── Snakes — colourful, googly-eyed ──────────────────────────────────
const SNAKE_PALETTE = [
  { body: '#2e8b3a', mid: '#52c462', belly: '#a8e8b0', dark: '#1a5c25' },  // green
  { body: '#d4691a', mid: '#f09040', belly: '#fcd0a0', dark: '#8c3d08' },  // orange
  { body: '#7030b0', mid: '#a060d8', belly: '#d4b0f0', dark: '#400878' },  // purple
];
let _si = 0;

function drawSnake(from, to) {
  const a = centre(from), b = centre(to);
  const sc = SNAKE_PALETTE[_si++ % 3];

  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy);
  const px = -dy/dist, py = dx/dist;
  const wig = Math.min(dist * 0.38, 65);

  const cp1x = a.x + dx*0.22 + px*wig,  cp1y = a.y + dy*0.22 + py*wig;
  const cp2x = a.x + dx*0.70 - px*wig,  cp2y = a.y + dy*0.70 - py*wig;
  const d = `M${a.x},${a.y} C${cp1x},${cp1y} ${cp2x},${cp2y} ${b.x},${b.y}`;

  // Drop shadow
  svg.appendChild(el('path', {
    d: d.replace(/(-?\d+\.?\d*),(-?\d+\.?\d*)/g,
      (_,x,y) => `${+x+2.5},${+y+3}`),
    stroke: 'rgba(0,0,0,0.13)', 'stroke-width': 17, fill:'none', 'stroke-linecap':'round'
  }));

  // Body — outline, fill, belly stripe
  svg.appendChild(el('path', { d, stroke: sc.dark,  'stroke-width': 17, fill:'none', 'stroke-linecap':'round' }));
  svg.appendChild(el('path', { d, stroke: sc.body,  'stroke-width': 13, fill:'none', 'stroke-linecap':'round' }));
  svg.appendChild(el('path', { d, stroke: sc.mid,   'stroke-width': 7,  fill:'none', 'stroke-linecap':'round' }));
  svg.appendChild(el('path', { d, stroke: sc.belly, 'stroke-width': 3,  fill:'none', 'stroke-linecap':'round',
    'stroke-dasharray': '5 9' }));

  // HEAD — direction from first control point toward head
  const headDir = Math.atan2(a.y - cp1y, a.x - cp1x);

  svg.appendChild(el('circle', { cx: a.x+2, cy: a.y+3, r: 15, fill: 'rgba(0,0,0,0.12)' }));
  svg.appendChild(el('circle', { cx: a.x, cy: a.y, r: 15, fill: sc.dark }));
  svg.appendChild(el('circle', { cx: a.x, cy: a.y, r: 12, fill: sc.body }));

  // Googly eyes
  const eyeSpread = 0.58;
  [-1,1].forEach(s => {
    const ex = a.x + Math.cos(headDir + s*eyeSpread) * 8;
    const ey = a.y + Math.sin(headDir + s*eyeSpread) * 8;
    // White sclera
    svg.appendChild(el('circle', { cx: ex+0.5, cy: ey+0.5, r: 5.5, fill: 'rgba(0,0,0,0.12)' }));
    svg.appendChild(el('circle', { cx: ex, cy: ey, r: 5.5, fill: 'white' }));
    // Pupil (offset toward look direction)
    const px2 = ex + Math.cos(headDir)*2, py2 = ey + Math.sin(headDir)*2;
    svg.appendChild(el('circle', { cx: px2, cy: py2, r: 2.8, fill: '#1a0a00' }));
    // Shine
    svg.appendChild(el('circle', { cx: px2-1, cy: py2-1, r: 1, fill: 'white' }));
  });

  // Forked tongue
  const tx = a.x + Math.cos(headDir)*15, ty = a.y + Math.sin(headDir)*15;
  const tf = 0.38, tl = 10;
  svg.appendChild(el('line', { x1:a.x+Math.cos(headDir)*13, y1:a.y+Math.sin(headDir)*13,
    x2:tx, y2:ty, stroke:'#e03030','stroke-width':2.5,'stroke-linecap':'round' }));
  [tf,-tf].forEach(f => svg.appendChild(el('line', {
    x1:tx, y1:ty,
    x2:tx+Math.cos(headDir+f)*tl, y2:ty+Math.sin(headDir+f)*tl,
    stroke:'#e03030','stroke-width':2,'stroke-linecap':'round'
  })));

  // Tapered tail
  svg.appendChild(el('circle', { cx: b.x, cy: b.y, r: 5, fill: sc.body }));
  svg.appendChild(el('circle', { cx: b.x, cy: b.y, r: 2.5, fill: sc.dark }));
}

// Ladders — short, medium, long
drawLadder(1,  10);   // short
drawLadder(7,  16);   // medium
drawLadder(3,  20);   // long

// Snakes — short, medium, long
drawSnake(17, 13);    // short (nearly horizontal — fun!)
drawSnake(22, 11);    // medium
drawSnake(29,  4);    // long

// ─────────────────────────────────────────────────────────────────────
//  Panel logic
// ─────────────────────────────────────────────────────────────────────
const keys = Object.keys(CONTENT).map(Number).sort((a,b)=>a-b);
let current = null;

function openPanel(num) {
  current = num;
  document.getElementById('pNum').textContent = `Square ${num}`;
  document.getElementById('pTitle').textContent = CONTENT[num].title;
  document.getElementById('pBody').innerHTML = CONTENT[num].body;
  document.getElementById('pBody').scrollTop = 0;

  const idx = keys.indexOf(num);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === keys.length - 1;

  document.getElementById('panel').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
  current = null;
}

function navigate(dir) {
  if (current === null) return;
  const idx = keys.indexOf(current) + dir;
  if (idx >= 0 && idx < keys.length) openPanel(keys[idx]);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});
</script>
</body>
</html>
